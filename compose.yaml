services:
  train:
    build: .
    image: bitcoin-monthly:local
    profiles: [training]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command: ["python", "-m", "bitcoin.train", "--as-of", "${AS_OF:-2026-10-05}"]
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts

  api:
    build: .
    image: bitcoin-monthly:local
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
